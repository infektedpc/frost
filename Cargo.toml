[workspace]
resolver = "2"
members = [
    "crates/frost",
    "crates/frost-engine",
    "crates/frost-extensions",
    "crates/frost-inspector",
]
# CRITICAL: servo/ is a nested workspace (its own Cargo.toml with
# [workspace]). Cargo resolves a path dependency nested inside a
# workspace directory against the OUTER workspace root unless the inner
# one is excluded — without this, `components/servo` inherits
# rust-version/edition/license from THIS root (wrong: edition 2021
# instead of 2024, no rust-version) and manifest loading fails.
# Excluding it makes cargo treat servo/ as its own workspace.
exclude = ["servo"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# Mirror the servo workspace's per-package dev-profile overrides so unit
# fingerprints match the already-built artifacts where possible (copied
# from the proven servo-de embedder Cargo.toml).
[profile.dev.package.crypto-bigint]
opt-level = 3

[profile.dev.package.servo-script]
codegen-units = 16

[profile.dev.package.sha1]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
