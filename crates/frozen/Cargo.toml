[package]
name = "frozen"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
# Freezer engine, one directory up: ../.. is the frost repo root, freezer/ is the
# nested engine repo (see FREEZER.md). Feature set mirrors the proven servo-de
# embedder: the same features servoshell enables MINUS webgl / webxr,
# which the sandbox cannot build (no libclang for mozangle's bindgen).
# Round 17 enables `media-gstreamer` (video/audio playback): it builds
# in the sandbox only with the gst-dev sysroot (GStreamer + GLib -dev
# files extracted from Ubuntu noble .debs into
# ~/workspace/harness-tmp/gst-dev — see r17-build-env.sh and README
# Round 17). Without that sysroot (or system -dev packages on another
# machine), the build fails at the gstreamer-sys build scripts.
# `subtlecrypto` is the 0.8.0 name for the old `webcrypto`.
servo = { path = "../../freezer/components/servo", default-features = false, features = [
    "background_hang_monitor",
    "bluetooth",
    "testbinding",
    "bundled",
    "brotli-compression-stream",
    "clipboard",
    "subtlecrypto",
    "default_tooling",
    "js_jit",
    "multiprocess",
    "gamepad",
    "webgpu",
    "devtools",
    "media-gstreamer",
] }
dpi = "0.1"
keyboard-types = "0.8"
url = "2"
# Round 16 (F-009): the hardware-first rendering fallback logs when it
# falls back to software, so the engine needs the `log` facade.
log = "0.4"
# Round 4 (F-003): print preview encodes the screenshot as PNG.
png = "0.17"

[dev-dependencies]
# The smoke example writes a PNG screenshot (same crate, kept here too
# so the example builds without the main dependencies).
png = "0.17"
